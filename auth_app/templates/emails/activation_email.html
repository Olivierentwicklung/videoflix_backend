<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate your Videoflix account</title>
</head>
<body style="margin: 0; background-color: #f4f4f4; color: #2e3a59; font-family: Arial, sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #f4f4f4; padding: 32px 16px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 600px; background-color: #ffffff; border-radius: 12px; padding: 40px;">
                    <tr>
                        <td align="center" style="padding-bottom: 32px;">
                            <a href="{{ site_url }}" style="text-decoration: none;">
                                <img src="{{ logo_url }}" width="251" height="40" alt="Videoflix">
                            </a>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <h1 style="margin: 0 0 20px; color: #2e3a59; font-size: 28px;">Activate your account</h1>
                            <p style="margin: 0 0 16px; font-size: 16px; line-height: 1.6;">Hello {{ email }},</p>
                            <p style="margin: 0 0 28px; font-size: 16px; line-height: 1.6;">Thank you for joining Videoflix. Confirm your email address to activate your account.</p>
                            <p style="margin: 0 0 28px; text-align: center;">
                                <a href="{{ activation_link }}" style="display: inline-block; border-radius: 8px; background-color: #2e3fff; color: #ffffff; font-size: 16px; font-weight: bold; padding: 14px 28px; text-decoration: none;">Activate account</a>
                            </p>
                            <p style="margin: 0 0 8px; font-size: 14px; line-height: 1.6;">If the button does not work, copy this link into your browser:</p>
                            <p style="margin: 0; overflow-wrap: anywhere; font-size: 14px; line-height: 1.6;"><a href="{{ activation_link }}" style="color: #2e3fff;">{{ activation_link }}</a></p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
